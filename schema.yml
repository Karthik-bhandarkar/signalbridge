openapi: 3.0.3
info:
  title: SignalBridge Webhook Ingestion API
  version: 1.0.0
  description: High-throughput webhook ingestion, deduplication, and incident grouping
    engine.
paths:
  /api/v1/webhooks/{source_slug}/:
    post:
      operationId: v1_webhooks_create
      description: Receives a raw webhook payload from a registered third-party alert
        producer. Enforces HMAC-SHA256 cryptographic signature authentication, validates
        the envelope, executes an O(1) Redis SET NX idempotency check (60s TTL), persists
        an initial IngestedPayload record, and returns an HTTP 202 Accepted ACK in
        < 100ms. Duplicate requests within 60s receive an immediate HTTP 200 OK without
        re-ingestion.
      summary: Ingest incoming webhook alert with HMAC verification & O(1) Redis Idempotency
      parameters:
      - in: path
        name: source_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIngestion'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestionResponse'
          description: Webhook successfully authenticated, accepted, and queued for
            processing.
        '200':
          description: Idempotent duplicate detected within 60s window. Webhook previously
            accepted.
        '400':
          description: Malformed or empty JSON payload envelope.
        '401':
          description: Missing, tampered, or mismatched HMAC signature.
        '403':
          description: Webhook source is deactivated or disabled.
        '404':
          description: Webhook source slug is not registered.
        '429':
          description: Source burst rate limit exceeded. Retry after specified delay.
components:
  schemas:
    WebhookIngestion:
      type: object
      description: |-
        Validates incoming raw webhook payload envelopes.

        Accepts raw alert data from external producers (e.g., PagerDuty, Datadog),
        extracts or generates a client tracking ID, and validates structural integrity.
      properties:
        tracking_id:
          type: string
          description: Optional upstream tracking or request correlation ID (e.g.,
            'alert-req-90812').
          maxLength: 128
        event_type:
          type: string
          default: alert.trigger
          description: Vendor-specific event classification string.
          maxLength: 100
        payload:
          description: The arbitrary raw JSON payload sent by the webhook producer.
      required:
      - payload
    WebhookIngestionResponse:
      type: object
      description: |-
        Serializes the HTTP 202 Accepted response payload returned by the gateway.
        Used for automated OpenAPI 3.0 Swagger schema documentation.
      properties:
        status:
          type: string
          default: accepted
          description: Status acknowledging successful receipt and queuing of the
            webhook.
        source:
          type: string
          description: URL slug of the authenticated webhook source (e.g., 'pagerduty').
        tracking_id:
          type: string
          description: Unique tracking ID assigned to this ingestion lifecycle.
        idempotency_hash:
          type: string
          description: SHA-256 fingerprint generated from the raw payload body for
            deduplication.
        received_at:
          type: string
          format: date-time
          description: UTC timestamp when the gateway received and recorded the webhook.
        message:
          type: string
          default: Webhook queued for processing
          description: Human-readable processing confirmation.
      required:
      - idempotency_hash
      - received_at
      - source
      - tracking_id
