<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d276b" />
      <stop offset="50%" stop-color="#241544" />
      <stop offset="100%" stop-color="#150a29" />
    </linearGradient>
    <linearGradient id="sb-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5eeff" />
      <stop offset="50%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sb-wave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Glow Ring -->
  <rect width="64" height="64" rx="16" fill="url(#sb-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.38" />

  <!-- Background subtle illumination -->
  <circle cx="32" cy="30" r="20" fill="#a855f7" fill-opacity="0.16" filter="url(#glow)" />

  <!-- Outer Bridge Arch -->
  <path d="M12 49V31a20 20 0 0 1 40 0v18" fill="none" stroke="url(#sb-arch)" stroke-width="3.8" stroke-linecap="round" />

  <!-- Inner Bridge Arch -->
  <path d="M22 49V33a10 10 0 0 1 20 0v16" fill="none" stroke="url(#sb-arch)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- Bridge Roadway -->
  <path d="M10 40h44" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.5" />

  <!-- Dynamic Signal Waveform Beam -->
  <path d="M10 40h10l3-5 5 9 4-6 4 3 4-1h14" fill="none" stroke="url(#sb-wave)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Live Pulse Beacon Dots -->
  <circle cx="28" cy="44" r="2.2" fill="#38bdf8" />
  <circle cx="32" cy="38" r="2.4" fill="#f5eeff" filter="url(#glow)" />
  <circle cx="36" cy="41" r="2.2" fill="#fbbf24" />
</svg>

