          description: |-
            Highest severity level observed across all grouped alerts.

            * `CRITICAL` - P1 - Critical Outage
            * `HIGH` - P2 - Major Degradation
            * `MEDIUM` - P3 - Moderate Impact
            * `LOW` - P4 - Informational / Low
