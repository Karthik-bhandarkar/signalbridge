            incidents.
        severity:
          allOf:
          - $ref: '#/components/schemas/AlertSeverityEnum'
          readOnly: true
          description: |-
            Severity tier of this individual alert.

            * `CRITICAL` - P1 - Critical
            * `HIGH` - P2 - High
            * `MEDIUM` - P3 - Medium
            * `LOW` - P4 - Low
        title:
          type: string
          readOnly: true
          description: Brief summary of the incident or alarm condition.
        description:
          type: string
          readOnly: true
