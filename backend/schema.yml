openapi: 3.0.3
info:
  title: SignalBridge Webhook Ingestion Engine API
  version: 1.0.0
  description: Enterprise High-Throughput Webhook Ingestion & Incident Correlation
    Engine
paths:
  /api/v1/alerts/:
    get:
      operationId: api_v1_alerts_list
      description: Lists alerts with pagination and filtering by service, severity,
        incident_id, and search query.
      summary: List Alerts
      parameters:
      - in: query
        name: incident_id
        schema:
          type: string
        description: Filter by parent incident UUID
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search title or external_id
      - in: query
        name: service
        schema:
          type: string
        description: Filter by service name
      - in: query
        name: severity
        schema:
          type: string
        description: Filter by severity (CRITICAL, HIGH, etc)
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertSummary'
          description: ''
  /api/v1/alerts/{id}/:
    get:
      operationId: api_v1_alerts_retrieve
      description: Retrieve full details for an individual Alert record.
      summary: Retrieve Alert Detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
          description: ''
        '404':
          description: Alert not found
  /api/v1/alerts/{id}/retry/:
    post:
      operationId: api_v1_alerts_retry_create
      description: Manually retries processing for an alert by re-enqueueing its raw
        IngestedPayload into Celery.
      summary: Retry Alert Ingestion
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '202':
          description: Payload re-enqueued for asynchronous processing.
        '400':
          description: Alert does not have an associated payload record.
        '404':
          description: Alert not found
  /api/v1/analytics/metrics/:
    get:
      operationId: api_v1_analytics_metrics_list
      description: Operator API returning granular, time-bucketed IngestionMetric
        records.
      summary: List Ingestion Metrics Time Series
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: ISO-8601 start timestamp for window filter
      - in: query
        name: limit
        schema:
          type: integer
        description: Max number of time buckets to return (default 60, max 500)
      - in: query
        name: source
        schema:
          type: string
        description: Filter by webhook source slug (e.g. 'pagerduty')
      - in: query
        name: to
        schema:
          type: string
        description: ISO-8601 end timestamp for window filter
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestionMetric'
          description: ''
  /api/v1/analytics/summary/:
    get:
      operationId: api_v1_analytics_summary_retrieve
      description: Operator API returning high-level aggregated SLA and throughput
        metrics.
      summary: Get Ingestion Performance Summary
      parameters:
      - in: query
        name: source
        schema:
          type: string
        description: Optional webhook source slug filter
      - in: query
        name: window_minutes
        schema:
          type: integer
        description: Rolling time window in minutes (default 60)
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionSummary'
          description: ''
  /api/v1/audit/:
    get:
      operationId: api_v1_audit_list
      description: Global chronological timeline of all IncidentEvents across the
        entire system.
      summary: List Audit Log Events
      parameters:
      - in: query
        name: actor
        schema:
          type: string
        description: Filter by actor
      - in: query
        name: event_type
        schema:
          type: string
        description: Filter by event type
      - in: query
        name: incident_id
        schema:
          type: string
        description: Filter by incident UUID
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentEvent'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: api_v1_auth_csrf_retrieve
      description: Ensures a CSRF cookie is set in the client's browser and returns
        the token in JSON.
      summary: Obtain CSRF Token
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: CSRF token set in cookie and returned in body.
  /api/v1/auth/login/:
    post:
      operationId: api_v1_auth_login_create
      description: Authenticates operator username & password, starting an HTTP session.
      summary: Operator Session Login
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Login successful; session cookie established.
        '400':
          description: Invalid request format.
        '401':
          description: Invalid username or password.
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Logs out the current operator and invalidates the session.
      summary: Operator Session Logout
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Session cleared.
  /api/v1/auth/me/:
    get:
      operationId: api_v1_auth_me_retrieve
      description: Returns current operator authentication status and user details
        including RBAC role.
      summary: Get Current Operator Profile
      tags:
      - api
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Profile details or unauthenticated status.
  /api/v1/auth/users/:
    get:
      operationId: api_v1_auth_users_list
      description: |-
        Lists all operator users with their assigned RBAC roles.
        Requires Admin or Superuser privileges.
      summary: List Operator Users and Roles
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/users/{user_id}/role/:
    patch:
      operationId: api_v1_auth_users_role_partial_update
      description: |-
        Updates the RBAC role for a specific user.
        Requires Admin or Superuser privileges.
        Prevents self-modification and modifying superusers.
      summary: Update Operator RBAC Role
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Role updated.
  /api/v1/incidents/:
    get:
      operationId: api_v1_incidents_list
      description: |-
        List and filter Incidents with pagination.
        Supports filtering by status, severity, service_name, search query, and sorting.
      summary: List Incidents
      parameters:
      - in: query
        name: ordering
        schema:
          type: string
        description: Sort order (e.g. -last_seen_at, -alert_count)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Results per page (max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search service name, fingerprint, or notes
      - in: query
        name: service
        schema:
          type: string
        description: Filter by service name
      - in: query
        name: severity
        schema:
          type: string
        description: Filter by severity (CRITICAL, HIGH, MEDIUM, LOW)
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (OPEN, ACKNOWLEDGED, RESOLVED)
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncidentList'
          description: ''
  /api/v1/incidents/{id}/:
    get:
      operationId: api_v1_incidents_retrieve
      description: Retrieve full details for an individual Incident, including correlated
        alerts and timeline events.
      summary: Retrieve Incident Detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
        '404':
          description: Incident not found
  /api/v1/incidents/{id}/acknowledge/:
    post:
      operationId: api_v1_incidents_acknowledge_create
      description: Transitions an OPEN incident to ACKNOWLEDGED, indicating an operator
        is investigating.
      summary: Acknowledge Incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAcknowledge'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
        '400':
          description: Invalid transition
  /api/v1/incidents/{id}/assign/:
    post:
      operationId: api_v1_incidents_assign_create
      description: Assigns an incident to an operator or on-call engineer.
      summary: Assign Incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAssign'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/notes/:
    post:
      operationId: api_v1_incidents_notes_create
      description: Appends an operator investigation note to the incident timeline.
      summary: Add Note to Incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAddNote'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEvent'
          description: ''
  /api/v1/incidents/{id}/reopen/:
    post:
      operationId: api_v1_incidents_reopen_create
      description: Manually reopens a previously resolved incident with justification.
      summary: Reopen Incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentReopen'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/incidents/{id}/resolve/:
    post:
      operationId: api_v1_incidents_resolve_create
      description: Resolves an active incident with required root cause resolution
        notes.
      summary: Resolve Incident
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentResolve'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetail'
          description: ''
  /api/v1/integrations/:
    get:
      operationId: api_v1_integrations_list
      description: Operator API to list and register webhook source integrations.
      summary: List Webhook Integrations
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSource'
          description: ''
    post:
      operationId: api_v1_integrations_create
      description: Operator API to list and register webhook source integrations.
      summary: Create Webhook Integration
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSourceCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSource'
          description: ''
  /api/v1/integrations/{id}/:
    get:
      operationId: api_v1_integrations_retrieve
      description: Operator API to retrieve, modify, or delete a webhook integration.
      summary: Retrieve Webhook Integration Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSource'
          description: ''
        '404':
          description: Integration not found
    patch:
      operationId: api_v1_integrations_partial_update
      description: Operator API to retrieve, modify, or delete a webhook integration.
      summary: Update Webhook Integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWebhookSource'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSource'
          description: ''
        '404':
          description: Integration not found
    delete:
      operationId: api_v1_integrations_destroy
      description: Operator API to retrieve, modify, or delete a webhook integration.
      summary: Delete Webhook Integration
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Integration not found
  /api/v1/integrations/{id}/regenerate-secret/:
    post:
      operationId: api_v1_integrations_regenerate_secret_create
      description: Rotates the cryptographic HMAC secret key for an integration.
      summary: Regenerate Integration Secret
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Secret key regenerated successfully.
  /api/v1/monitors/:
    get:
      operationId: api_v1_monitors_list
      summary: List Synthetic Monitors
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Monitor'
          description: ''
    post:
      operationId: api_v1_monitors_create
      summary: Create Synthetic Monitor
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Monitor'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: ''
  /api/v1/monitors/{id}/:
    get:
      operationId: api_v1_monitors_retrieve
      summary: Retrieve Synthetic Monitor Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: ''
        '404':
          description: Monitor not found
    patch:
      operationId: api_v1_monitors_partial_update
      summary: Update Synthetic Monitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMonitor'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
          description: ''
        '404':
          description: Monitor not found
    delete:
      operationId: api_v1_monitors_destroy
      summary: Delete Synthetic Monitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Monitor not found
  /api/v1/monitors/{id}/test/:
    post:
      operationId: api_v1_monitors_test_create
      description: Triggers an immediate on-demand probe for this monitor.
      summary: Execute Immediate Monitor Probe
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Probe execution summary
  /api/v1/notifications/deliveries/:
    get:
      operationId: api_v1_notifications_deliveries_list
      summary: List Notification Deliveries
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDelivery'
          description: ''
  /api/v1/notifications/destinations/:
    get:
      operationId: api_v1_notifications_destinations_list
      summary: List Notification Destinations
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDestination'
          description: ''
    post:
      operationId: api_v1_notifications_destinations_create
      summary: Create Notification Destination
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationDestination'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDestination'
          description: ''
  /api/v1/notifications/destinations/{id}/:
    get:
      operationId: api_v1_notifications_destinations_retrieve
      summary: Retrieve Notification Destination
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDestination'
          description: ''
        '404':
          description: Destination not found
    patch:
      operationId: api_v1_notifications_destinations_partial_update
      summary: Update Notification Destination
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationDestination'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDestination'
          description: ''
        '404':
          description: Destination not found
    delete:
      operationId: api_v1_notifications_destinations_destroy
      summary: Delete Notification Destination
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Destination not found
  /api/v1/notifications/destinations/{id}/test-dispatch/:
    post:
      operationId: api_v1_notifications_destinations_test_dispatch_create
      description: |-
        Triggers a synthetic test notification dispatch to verify endpoint reachability.
        Requires Admin or Superuser privileges.
      summary: Test Notification Destination Dispatch
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Test notification dispatched.
  /api/v1/services/:
    get:
      operationId: api_v1_services_list
      summary: List Monitored Services
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
          description: ''
    post:
      operationId: api_v1_services_create
      summary: Register New Monitored Service
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/v1/services/{id}/:
    get:
      operationId: api_v1_services_retrieve
      summary: Retrieve Service Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
        '404':
          description: Service not found
    patch:
      operationId: api_v1_services_partial_update
      summary: Update Service
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedService'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
        '404':
          description: Service not found
    delete:
      operationId: api_v1_services_destroy
      summary: Delete Service
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Service not found
  /api/v1/webhooks/{source_slug}/:
    post:
      operationId: api_v1_webhooks_create
      description: Receives a raw webhook payload from a registered third-party alert
        producer. Enforces HMAC-SHA256 cryptographic signature authentication, validates
        the envelope, executes distributed rate limiting, persists a durable IngestedPayload
        record with database unique constraint protection against duplicates, and
        returns an HTTP 202 Accepted ACK in < 100ms. Duplicate requests receive an
        immediate HTTP 200 OK without re-ingestion.
      summary: Ingest incoming webhook alert with HMAC verification & Durable Idempotency
      parameters:
      - in: path
        name: source_slug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookIngestion'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookIngestionResponse'
          description: Webhook successfully authenticated, accepted, and queued for
            processing.
        '200':
          description: Idempotent duplicate detected. Webhook previously accepted.
        '400':
          description: Malformed or empty JSON payload envelope.
        '401':
          description: Missing, tampered, or mismatched HMAC signature.
        '403':
          description: Webhook source is deactivated or disabled.
        '404':
          description: Webhook source slug is not registered.
        '429':
          description: Source burst rate limit exceeded. Retry after specified delay.
  /health/live/:
    get:
      operationId: health_live_retrieve
      description: Lightweight probe verifying the application process is alive and
        accepting connections.
      summary: Kubernetes Liveness Probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: Process is alive.
  /health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Verifies database and cache connectivity. Returns 200 if ready,
        503 if any dependent dependency is down.
      summary: Kubernetes Readiness Probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: All dependencies healthy and ready for traffic.
        '503':
          description: One or more critical dependencies failed health check.
components:
