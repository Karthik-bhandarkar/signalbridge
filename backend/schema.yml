        total_received:
          type: integer
          readOnly: true
          description: Total number of HTTP requests received in this window.
        total_accepted:
          type: integer
          readOnly: true
          description: Total number of valid requests queued (HTTP 202).
        total_duplicates:
          type: integer
          readOnly: true
          description: Total duplicate requests recognized via idempotency (HTTP 200).
        total_rejected:
          type: integer
          readOnly: true
          description: Total number of requests rejected across all rejection categories.
        rejected_auth:
          type: integer
          readOnly: true
          description: Total signature or credential verification failures (HTTP 401).
        rejected_rate_limit:
          type: integer
          readOnly: true
          description: Total requests rejected due to rate limiting (HTTP 429).
        rejected_malformed:
          type: integer
          readOnly: true
          description: Total malformed payloads or missing required fields/envelope
