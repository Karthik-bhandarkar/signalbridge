name: SignalBridge CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: signalbridge_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      USE_POSTGRES: "true"
      POSTGRES_DB: signalbridge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_STORAGE_BUCKET_NAME: signalbridge-raw-archives
      AWS_S3_REGION_NAME: us-east-1

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements/local.txt"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/local.txt

      - name: Execute Django System Checks
        run: |
          python manage.py check

      - name: Apply Database Migrations
        run: |
          python manage.py migrate

      - name: Run Pytest Suite with 80%+ Coverage
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: backend/coverage.xml

  frontend-build:
    name: Frontend Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Frontend Code
        run: npm run lint

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Build Next.js Application (Production Standalone)
        run: npm run build

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

  cd-deploy:
    name: Continuous Deployment to AWS EC2
    needs: [backend-test, frontend-build, docker-validation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Automated Remote Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_KEY" ]; then
            echo "⚠️ AWS deployment secrets (EC2_HOST, EC2_SSH_KEY) not yet configured in GitHub Repository Settings."
            echo "Live deployment: NOT VERIFIED — deployment URL must be located or configured."
            echo "Skipping automated remote deploy."
            exit 0
          fi
          echo "=========================================================="
          echo "🚀 Initiating Automated Deployment to AWS EC2 ($EC2_HOST)..."
          echo "=========================================================="
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" 'bash -s' << 'EOF'
            set -e
            echo "📥 [1/4] Pulling latest main branch on EC2..."
            cd /home/ubuntu/signalbridge || cd ~/signalbridge
            git fetch origin main
            git reset --hard origin/main
            echo "🐳 [2/4] Building and launching updated containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            echo "🗄️ [3/4] Running database migrations..."
            sleep 5
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput || true
            echo "🎉 [4/4] Automated Deployment to AWS Succeeded!"
          EOF
